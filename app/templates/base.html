<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERP Tracker{% block title %}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <nav class="bg-gray-900 border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <a href="/" class="text-lg font-bold text-emerald-400">SERP Tracker</a>
        <div class="flex gap-6 text-sm">
          <a href="/" class="hover:text-emerald-400 transition">Dashboard</a>
          <a href="/competitors" class="hover:text-emerald-400 transition">Competitors</a>
          <a href="/cannibalization" class="hover:text-emerald-400 transition">Cannibalization</a>
          <a href="/volatility" class="hover:text-emerald-400 transition">Volatility</a>
          <a href="/paa" class="hover:text-emerald-400 transition">PAA</a>
          <a href="/settings" class="hover:text-emerald-400 transition">Settings</a>
        </div>
      </div>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
